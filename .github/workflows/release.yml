name: Release

on:
  push:
    tags: ['v*']
  # A dry run from the Actions tab: the same tests and installer, as version 0.0.0, kept as the run's artifact; no release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Read the version from the tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cnotmatch '^v\d+\.\d+\.\d+$') { throw "The tag '$tag' is not vX.Y.Z. Push a tag such as v0.1.0." }
          $version = $tag.Substring(1)
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Use version 0.0.0 for a dry run
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: '"VERSION=0.0.0" >> $env:GITHUB_ENV'

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: true

      # The runner image may come with another Inno Setup: upgrade or downgrade to the pinned one, and show which runs.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --version 6.7.1 -y --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw "choco upgrade innosetup failed with exit code $LASTEXITCODE." }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $info = (Get-Item $iscc).VersionInfo
          "ISCC $($info.ProductVersion) (file $($info.FileVersion)) at $iscc"

      - name: Test and build the installer
        shell: pwsh
        run: ./gradlew.bat test installer "-Pchairplay.version=$env:VERSION" "-Pinno.iscc=${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" --console=plain

      - name: Draft the release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @('release', 'create', $env:GITHUB_REF_NAME, "build/installer/ChairPlay-$env:VERSION-setup.exe", '--draft', '--title', $env:GITHUB_REF_NAME, '--notes=')
          if ($env:VERSION.StartsWith('0.')) { $ghArgs += '--prerelease' }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }

      - name: Keep the dry run's installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ChairPlay-0.0.0-setup
          path: build/installer/ChairPlay-0.0.0-setup.exe
          if-no-files-found: error
